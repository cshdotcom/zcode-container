# cloudflared 本地路由配置（与容器内服务一一对应）
tunnel: REPLACE_WITH_YOUR_TUNNEL_ID
credentials-file: /etc/cloudflared/credentials/tunnel-credentials.json
originRequest:
  noTLSVerify: true
  connectTimeout: 10s

ingress:
  - hostname: zcode.910500.xyz
    service: http://zcode:3030
  - hostname: zcode.nodebyte.cn
    service: http://zcode:3030
  - hostname: desktop.910500.xyz
    service: http://zcode:7183
  - hostname: desktop.nodebyte.cn
    service: http://zcode:7183
  - hostname: preview.910500.xyz
    service: http://preview:81
  - hostname: preview.nodebyte.cn
    service: http://preview:81
  - hostname: preview2.910500.xyz
    service: http://preview:82
  - hostname: preview2.nodebyte.cn
    service: http://preview:82
  - service: http_status:404
