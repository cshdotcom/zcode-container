# cloudflared 本地路由配置（与容器内服务一一对应）
tunnel: REPLACE_WITH_YOUR_TUNNEL_ID
credentials-file: /etc/cloudflared/credentials/tunnel-credentials.json
originRequest:
  # 全部源均为明文 http（桌面经网关 nginx :83），不依赖 noTLSVerify，零 502 风险
  connectTimeout: 10s

ingress:
  - hostname: zcode.example-a.com
    service: http://zcode:3030
  - hostname: zcode.example-b.com
    service: http://zcode:3030
  - hostname: desktop.example-a.com
    service: http://preview:83
  - hostname: desktop.example-b.com
    service: http://preview:83
  - hostname: preview.example-a.com
    service: http://preview:81
  - hostname: preview.example-b.com
    service: http://preview:81
  - hostname: preview2.example-a.com
    service: http://preview:82
  - hostname: preview2.example-b.com
    service: http://preview:82
  - service: http_status:404
