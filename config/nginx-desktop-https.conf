# 内网 HTTPS 远程桌面入口（自签证书）：
#   https://<内网/VPN IP>:47184  ->  http://zcode:7183 (Selkies HTTP)
# 外网继续走 cloudflared -> 7183（HTTP 由 Cloudflare 边缘终结 TLS）
server {
    listen 47184 ssl;
    http2 on;

    ssl_certificate     /etc/nginx/certs/desktop-lan.crt;
    ssl_certificate_key /etc/nginx/certs/desktop-lan.key;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_session_cache shared:SSL:10m;

    # Selkies WebSocket 长连接
    proxy_http_version 1.1;
    proxy_set_header Upgrade $http_upgrade;
    proxy_set_header Connection "upgrade";
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto https;
    proxy_read_timeout 3600s;
    proxy_send_timeout 3600s;
    proxy_buffering off;

    location / {
        proxy_pass http://zcode:7183;
    }
}
