# 桌面网关：Selkies 本体保持纯 HTTP(:7183)，TLS 全部由 nginx 终止
#   :83  —— Cloudflare 隧道路径：cloudflared 源为明文 http（绝不 502），
#            并按 CF-Connecting-IP 还原访客真实 IP（不映射到宿主机，仅供隧道容器访问）
#   :443 —— 内网/VPN HTTPS 直连：自签证书，宿主机映射 47184 -> 443
# 两条路径都反代 http://zcode:7183；认证用 Selkies 自带的 Basic Auth（透明透传）

# WebSocket 升级映射（Selkies 主传输 = WebSockets）
map $http_upgrade $connection_upgrade {
    default upgrade;
    ''      close;
}

# CF 真实 IP 日志格式：还原后的 $remote_addr = 访客真实 IP；[] 内为原始头值
log_format cf_ip '$remote_addr [$http_cf_connecting_ip] [$time_local] '
                 '"$request" $status $body_bytes_sent '
                 '"$http_user_agent" upstream=$upstream_addr';

# ---------- 路径 A：Cloudflare 隧道（desktop 域名 -> cloudflared -> 本块） ----------
server {
    listen 83;
    server_name desktop.example-a.com desktop.example-b.com;

    # CF 真实客户端 IP 还原：
    #   隧道流量源地址是 docker 网段（cloudflared 容器，默认地址池 172.16.0.0/12），
    #   访客真实 IP 在 Cloudflare 边缘注入的 CF-Connecting-IP 头里。
    #   自建 bridge 网段不同（如 10.x）时，请把 set_real_ip_from 同步改掉。
    set_real_ip_from 172.16.0.0/12;
    real_ip_header CF-Connecting-IP;

    access_log /dev/stdout cf_ip;

    proxy_http_version 1.1;
    proxy_set_header Upgrade $http_upgrade;
    proxy_set_header Connection $connection_upgrade;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto https;   # TLS 已在 Cloudflare 边缘终结
    proxy_read_timeout 3600s;
    proxy_send_timeout 3600s;
    client_max_body_size 512m;                   # Selkies 文件上传

    location / {
        proxy_pass http://zcode:7183;
    }
}

# ---------- 路径 B：内网/VPN HTTPS 直连（https://<内网/VPN IP>:47184） ----------
server {
    listen 443 ssl;
    server_name desktop.example-a.com desktop.example-b.com;

    ssl_certificate     /etc/nginx/certs/desktop-lan.crt;
    ssl_certificate_key /etc/nginx/certs/desktop-lan.key;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_session_cache shared:desktop_ssl:10m;
    ssl_session_timeout 1h;

    access_log /dev/stdout cf_ip;

    proxy_http_version 1.1;
    proxy_set_header Upgrade $http_upgrade;
    proxy_set_header Connection $connection_upgrade;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto https;
    proxy_read_timeout 3600s;
    proxy_send_timeout 3600s;
    client_max_body_size 512m;

    location / {
        proxy_pass http://zcode:7183;
    }
}
