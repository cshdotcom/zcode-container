# 动态优先：AI 在 zcode 容器 8080 起 dev server 即转发；
# 服务未起（502/连接拒绝）自动回落到静态目录 workspace/preview/
server {
    listen 81;
    server_name preview.example-a.com preview.example-b.com;

    # 静态兜底目录（与动态服务共用同一内容源）
    root /usr/share/nginx/html/preview;
    index index.html index.htm;

    # WebSocket 升头透传（dev server 常用）
    proxy_http_version 1.1;
    proxy_set_header Upgrade $http_upgrade;
    proxy_set_header Connection "upgrade";
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_read_timeout 3600s;
    proxy_send_timeout 3600s;

    location / {
        proxy_pass http://zcode:8080;
        proxy_intercept_errors on;
        error_page 502 503 504 = @fallback_static;
    }

    location @fallback_static {
        try_files $uri $uri/ =404;
    }

    location ~ /\. { deny all; }
    add_header X-Content-Type-Options nosniff;
    add_header X-Frame-Options SAMEORIGIN;
}
