server {
    # 静态预览（preview 域名 / 内网 :40881 的主入口）
    # default_server：内网直连 40881 时 Host 是裸 IP，须由本 vhost 兜底，
    # 否则会落入镜像自带 default.conf（:80 首个 server）而 404
    listen 80 default_server;
    server_name preview.example-a.com preview.example-b.com;

    root /usr/share/nginx/html/preview;
    index index.html index.htm;

    location / {
        try_files $uri $uri/ =404;
    }
    location ~ /\. { deny all; }
    location ~* \.(js|css|png|jpg|jpeg|gif|svg|woff2?)$ {
        expires 7d;
        add_header Cache-Control "public";
    }
    add_header X-Content-Type-Options nosniff;
    add_header X-Frame-Options SAMEORIGIN;
    add_header Referrer-Policy no-referrer;
}
