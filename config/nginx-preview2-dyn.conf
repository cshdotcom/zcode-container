# 动态优先 2：AI 在 zcode 容器 8090 起 dev server 即转发；
# 未起服务自动回落静态目录 workspace/preview2/
server {
    listen 82;
    server_name preview2.910500.xyz preview2.nodebyte.cn;

    root /usr/share/nginx/html/preview2;
    index index.html index.htm;

    proxy_http_version 1.1;
    proxy_set_header Upgrade $http_upgrade;
    proxy_set_header Connection "upgrade";
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_read_timeout 3600s;
    proxy_send_timeout 3600s;

    location / {
        proxy_pass http://zcode:8090;
        proxy_intercept_errors on;
        error_page 502 503 504 = @fallback_static;
    }

    location @fallback_static {
        try_files $uri $uri/ =404;
    }

    location ~ /\. { deny all; }
    add_header X-Content-Type-Options nosniff;
    add_header X-Frame-Options SAMEORIGIN;
}
