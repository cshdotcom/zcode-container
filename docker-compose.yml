# ZCode 自托管 AI 工作容器 —— Cloudflare Tunnel + 内网双通道部署
# 公网：全部流量经 cloudflared 出站隧道（公网 IP 零端口）
# 内网/VPN：高位端口直连（避开常用端口；可绑定 VPN 网卡 IP，公网网卡仍零端口）
# 预览位：动态优先、静态兜底（AI 起了 dev server 即转发，没起回落静态目录）
# 桌面：Selkies 原生 HTTPS（SELKIES_ENABLE_HTTPS，单监听器）——外网 CF 边缘 TLS，内网 https://IP:47183 自签证书；桌面路径不经 nginx
name: zcode-tunnel

services:
  zcode:
    image: ghcr.io/cshdotcom/zcode-container:1.0.0
    # 国内加速（与 GHCR 内容一致，sha256 已核对）：
    # image: swr.cn-north-4.myhuaweicloud.com/ddn-k8s/ghcr.io/cshdotcom/zcode-container:1.0.0
    container_name: zcode-container
    restart: unless-stopped
    shm_size: "2gb"
    networks: [znet]
    # ---- 内网/VPN 直连端口（全部高位端口；EXT_BIND_ADDR 可绑定 VPN 网卡 IP）----
    ports:
      - "${EXT_BIND_ADDR:-0.0.0.0}:${EXT_ZCODE_PORT:-43030}:3030"
      - "${EXT_BIND_ADDR:-0.0.0.0}:${EXT_SELKIES_PORT:-47183}:7183"
      - "${EXT_BIND_ADDR:-0.0.0.0}:${EXT_DYNPREV_PORT:-40808}:8080"
      - "${EXT_BIND_ADDR:-0.0.0.0}:${EXT_SPARE_PORT:-40809}:8090"
    environment:
      TZ: ${TZ:-Asia/Shanghai}
      ZCODE_WEB_TOKEN: ${ZCODE_WEB_TOKEN:?请在 .env 中设置}
      SELKIES_PORT: "7183"
      SELKIES_PUBLIC: "true"
      SELKIES_IDLE_TIMEOUT: ${SELKIES_IDLE_TIMEOUT:-900}
      SELKIES_MODE: ${SELKIES_MODE:-websockets}
      SELKIES_ENABLE_DUAL_MODE: "true"
      SELKIES_ENABLE_HTTPS: "true"
      # 原生 TLS：证书挂载到 /certs（Selkies 官方变量，cert_reload_interval 默认 30s 自动重载）
      SELKIES_HTTPS_CERT: /certs/desktop-lan.crt
      SELKIES_HTTPS_KEY: /certs/desktop-lan.key
      SELKIES_SESSION: ${SELKIES_SESSION:-openbox}
      SELKIES_ENABLE_BASIC_AUTH: "true"
      SELKIES_BASIC_AUTH_USER: ${DESKTOP_AUTH_USER:?请在 .env 中设置}
      SELKIES_BASIC_AUTH_PASSWORD: ${DESKTOP_AUTH_PASSWORD:?请在 .env 中设置}
      SELKIES_TURN_HOST: ${SELKIES_TURN_HOST:-}
      SELKIES_TURN_PORT: ${SELKIES_TURN_PORT:-}
      SELKIES_TURN_USERNAME: ${SELKIES_TURN_USERNAME:-}
      SELKIES_TURN_PASSWORD: ${SELKIES_TURN_PASSWORD:-}
      SELKIES_TURN_SHARED_SECRET: ${SELKIES_TURN_SHARED_SECRET:-}
    volumes:
      # ---- 全部持久化数据统一落在宿主机 ${ZCODE_BASE_DIR:-/srv/zcode} ----
      - ${ZCODE_BASE_DIR:-/srv/zcode}/workspace:/workspace
      - ${ZCODE_BASE_DIR:-/srv/zcode}/data/zcode:/root/.zcode
      - ${ZCODE_BASE_DIR:-/srv/zcode}/data/edge-profile:/data/edge-profile
      - ${ZCODE_BASE_DIR:-/srv/zcode}/data/singbox:/etc/sing-box
      - ${ZCODE_BASE_DIR:-/srv/zcode}/data/extra1:/data/extra1
      - ${ZCODE_BASE_DIR:-/srv/zcode}/data/extra2:/data/extra2
      - ${ZCODE_BASE_DIR:-/srv/zcode}/data/extra3:/data/extra3
      # Selkies 原生 TLS 证书（替换后 30s 内自动重载）
      - ${ZCODE_BASE_DIR:-/srv/zcode}/config/certs:/certs:ro
      # 脚本补丁（镜像 v1.0.0 不重建：https 模式健康检查/状态探测 + 提示文案）
      - ${ZCODE_BASE_DIR:-/srv/zcode}/config/app-patch/desktop-on.sh:/usr/local/bin/desktop-on.sh:ro
      - ${ZCODE_BASE_DIR:-/srv/zcode}/config/app-patch/desktop-status.sh:/usr/local/bin/desktop-status.sh:ro
      - ${ZCODE_BASE_DIR:-/srv/zcode}/config/app-patch/healthcheck.sh:/usr/local/bin/healthcheck.sh:ro
    healthcheck:
      test: ["CMD", "healthcheck.sh"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 120s

  # ---------- 网关 nginx：静态预览 + 动态回退预览（桌面不经 nginx：Selkies 原生 TLS） ----------
  preview:
    image: nginx:alpine
    # 国内服务器可用加速源：
    # image: swr.cn-north-4.myhuaweicloud.com/ddn-k8s/docker.io/nginx:alpine
    container_name: zcode-preview
    restart: unless-stopped
    networks: [znet]
    # 40881 -> 80  纯静态预览（preview.*）
    # 40882 -> 81  动态优先(zcode:8080) + 静态兜底（preview.*）
    # 40883 -> 82  动态优先(zcode:8090) + 静态兜底（preview2.*）
    ports:
      - "${EXT_BIND_ADDR:-0.0.0.0}:${EXT_STATPREV_PORT:-40881}:80"
      - "${EXT_BIND_ADDR:-0.0.0.0}:${EXT_DYNPREV1_PORT:-40882}:81"
      - "${EXT_BIND_ADDR:-0.0.0.0}:${EXT_DYNPREV2_PORT:-40883}:82"
    volumes:
      - ${ZCODE_BASE_DIR:-/srv/zcode}/workspace/preview:/usr/share/nginx/html/preview:ro
      - ${ZCODE_BASE_DIR:-/srv/zcode}/workspace/preview2:/usr/share/nginx/html/preview2:ro
      - ${ZCODE_BASE_DIR:-/srv/zcode}/config/nginx-preview-static.conf:/etc/nginx/conf.d/preview-static.conf:ro
      - ${ZCODE_BASE_DIR:-/srv/zcode}/config/nginx-preview-dyn.conf:/etc/nginx/conf.d/preview-dyn.conf:ro
      - ${ZCODE_BASE_DIR:-/srv/zcode}/config/nginx-preview2-dyn.conf:/etc/nginx/conf.d/preview2-dyn.conf:ro
    depends_on:
      zcode:
        condition: service_healthy

  # ---------- Cloudflare Tunnel：公网唯一通道（纯出站） ----------
  cloudflared:
    image: cloudflare/cloudflared:latest
    # 国内服务器可用加速源：
    # image: swr.cn-north-4.myhuaweicloud.com/ddn-k8s/docker.io/cloudflare/cloudflared:latest
    container_name: zcode-cloudflared
    restart: unless-stopped
    networks: [znet]
    command: tunnel --no-autoupdate --config /etc/cloudflared/config/config.yml run
    volumes:
      - ${ZCODE_BASE_DIR:-/srv/zcode}/config/tunnel-credentials.json:/etc/cloudflared/credentials/tunnel-credentials.json:ro
      - ${ZCODE_BASE_DIR:-/srv/zcode}/config/config.yml:/etc/cloudflared/config/config.yml:ro
    depends_on:
      zcode:
        condition: service_healthy
      preview:
        condition: service_started

networks:
  znet:
    driver: bridge

# 无命名卷：全部数据经 bind mount 落在 ${ZCODE_BASE_DIR:-/srv/zcode}（workspace/ + data/ + config/）
